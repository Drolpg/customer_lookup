[project]
name = "customer-lookup"
version = "0.1.0"
description = "Serviço de consultas de clientes com processamento assíncrono e integração resiliente"
readme = "README.md"
authors = [
    { name = "Drolpg", email = "leandronascimento.drolpg21@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "celery[redis]>=5.6.3",
    "fastapi>=0.143",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["customer_lookup"]

[tool.mypy]
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "fakeredis>=2.39.0",
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.0",
]
